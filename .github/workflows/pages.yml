# Deploys the site to GitHub Pages with concurrency control, so overlapping
# pushes (your own commits + the ratings-source Action publishing data) no
# longer collide with "Deployment failed, try again later".
name: Deploy site to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow this workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time. A newer run cancels an older in-flight one
# instead of both failing — this is the fix for the collisions.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload the whole site as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
